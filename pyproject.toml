[project]
  name = "cartolafc"
  version = "0.1.0"
  description = "Modern Python client for the Cartola FC fantasy‑football API"
  authors = [{ name = "Vicente Neto" }]
  license = "MIT"
  readme = "README.md"
  requires-python = ">=3.11"

  # runtime deps
  dependencies = [
      "httpx>=0.27.0",
      "pydantic>=2.7.0"
  ]

[project.optional-dependencies]
  dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "black",
    "pre-commit"
  ]

[build-system]
  requires = ["hatchling>=1.24.0"]
  build-backend = "hatchling.build"

[tool.black]
  line-length = 100
  preview = true

[tool.ruff]
  target-version = "py311"
  line-length = 100

# ---- Hatch build config (flat‑layout) ----
[tool.hatch.build.targets.wheel]
  packages = ["cartolafc"]

[tool.hatch.build.targets.sdist]
  packages = ["cartolafc"]
